# Nginx configuration for AlgoArena production deployment
#
# This configuration serves the Vite frontend static files and proxies
# API and Socket.IO requests to the Express backend.
#
# Usage:
#   1. Build frontend: npm run build -w @algoarena/frontend
#   2. Start backend: npm run start -w @algoarena/backend
#   3. Copy this file to /etc/nginx/sites-available/algoarena
#   4. Create symlink: ln -s /etc/nginx/sites-available/algoarena /etc/nginx/sites-enabled/
#   5. Test: nginx -t
#   6. Reload: systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name algoarena.com www.algoarena.com;

    # Redirect HTTP to HTTPS (uncomment for production with SSL)
    # return 301 https://$server_name$request_uri;
# }

# server {
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # server_name algoarena.com www.algoarena.com;

    # SSL certificate (use Let's Encrypt certbot)
    # ssl_certificate /etc/letsencrypt/live/algoarena.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/algoarena.com/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;

    # Frontend static files (Vite build output)
    root /var/www/algoarena/frontend/dist;
    index index.html;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Frontend routes - SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API - Proxy to Express
    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts for long-running requests (Judge0, AI)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Socket.IO - WebSocket proxy
    location /socket.io/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # WebSocket timeouts
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
